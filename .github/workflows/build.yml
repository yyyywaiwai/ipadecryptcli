name: Build binaries

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: make test
      - name: Build and verify archive
        run: make check-package
      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: ipadecrypt-macos-${{ matrix.arch }}
          path: dist/ipadecrypt-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: ipadecrypt-macos-*
          path: dist
          merge-multiple: true
      - name: Publish release with both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -s dist/ipadecrypt-macos-arm64.tar.gz
          test -s dist/ipadecrypt-macos-x86_64.tar.gz
          gh release create "$TAG" \
            dist/ipadecrypt-macos-arm64.tar.gz \
            dist/ipadecrypt-macos-x86_64.tar.gz \
            --verify-tag --generate-notes --title "$TAG"
