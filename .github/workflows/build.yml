name: Build binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: make test
      - name: Build and verify archive
        run: make check-package
      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: ipadecrypt-macos-${{ matrix.arch }}
          path: dist/ipadecrypt-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
